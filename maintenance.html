<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>javabypankaj — Be Right Back!</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);color:#fff;text-align:center;padding:20px;overflow:hidden;}
    .bg{position:fixed;inset:0;z-index:0;}
    .bg span{position:absolute;font-size:14px;opacity:0.04;font-family:monospace;white-space:nowrap;color:#fff;animation:fall linear infinite;}
    @keyframes fall{0%{transform:translateY(-100px);}100%{transform:translateY(110vh);}}
    .card{position:relative;z-index:1;max-width:520px;padding:50px 40px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:24px;backdrop-filter:blur(20px);}
    .icon{font-size:64px;margin-bottom:20px;animation:bounce 2s ease infinite;}
    @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
    h1{font-size:28px;font-weight:800;margin-bottom:8px;}
    h1 span{color:#fcb045;}
    .msg{font-size:18px;color:#fff;margin:16px 0 24px;line-height:1.6;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,0.15);}
    .tip{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:16px;padding:16px 20px;margin:20px 0;text-align:left;}
    .tip__label{font-size:12px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;opacity:0.8;}
    .tip__code{font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;color:rgba(255,255,255,0.9);line-height:1.8;white-space:pre-wrap;}
    .timer{font-family:monospace;font-size:42px;font-weight:800;color:#fff;margin:20px 0;letter-spacing:2px;text-shadow:0 2px 10px rgba(0,0,0,0.2);}
    .sub{font-size:14px;color:rgba(255,255,255,0.7);margin-top:24px;}
    .sub a{color:#fff;text-decoration:none;font-weight:600;}
    .sub a:hover{text-decoration:underline;}
    .refresh{display:inline-block;margin-top:20px;padding:12px 28px;background:#fff;color:#833ab4;border:none;border-radius:25px;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;text-decoration:none;}
    .refresh:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.25);}
    @media(max-width:480px){.card{padding:30px 20px;}h1{font-size:22px;}.msg{font-size:16px;}.timer{font-size:32px;}.tip__code{font-size:12px;}}
  </style>
</head>
<body>
  <!-- Falling code background -->
  <div class="bg" id="bg"></div>

  <div class="card">
    <div class="icon">☕</div>
    <h1>Brewing something <span>better</span>!</h1>
    <p class="msg">javabypankaj is taking a quick coffee break.<br>We'll be back with more interview questions soon.</p>

    <div class="timer" id="timer">05:00</div>

    <div class="tip">
      <div class="tip__label">☕ While you wait</div>
      <div class="tip__code" id="tip"></div>
    </div>

    <a class="refresh" href="javascript:location.reload()">↻ Try Again</a>

    <p class="sub">
      Meanwhile, connect with me:<br>
      <a href="https://www.linkedin.com/in/p7ksingh/" target="_blank">LinkedIn</a> · 
      <a href="https://github.com/p7ksingh" target="_blank">GitHub</a> · 
      <a href="mailto:p7ksingh@gmail.com">p7ksingh@gmail.com</a>
    </p>
  </div>

  <script>
    // Countdown timer
    var seconds = 300;
    var timerEl = document.getElementById('timer');
    setInterval(function(){
      if(seconds<=0){location.reload();return;}
      seconds--;
      var m=Math.floor(seconds/60), s=seconds%60;
      timerEl.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    },1000);

    // Random Java tips
    var tips=[
      'Go grab a coffee ☕ and come back refreshed.\nYour interview prep isn\'t going anywhere!',
      'Take a deep breath. Stretch your legs.\nGreat developers also know when to take a break.',
      'Perfect time for a chai break! 🍵\nWe\'re updating things to make your prep even better.',
      'Step away from the screen for a bit.\nYour brain processes better after a short break!',
      'Go hydrate! Drink some water 💧\nA refreshed mind learns 2x faster.',
      'Quick snack time? 🍪\nFun fact: your brain uses 20% of your body\'s energy.',
      'Stand up. Walk around. Look outside.\nWe\'ll have everything ready when you\'re back!',
      'Maybe text a friend? Call your mom?\nWe\'re almost done here. Promise! 😄',
      'Close your eyes for 2 minutes.\nPower naps between study sessions actually help memory!',
      'Go make yourself a nice cup of coffee ☕\nand come back — we\'ll be ready for you.'
    ];
    document.getElementById('tip').textContent=tips[Math.floor(Math.random()*tips.length)];

    // Falling code effect
    var codeWords=['public','class','void','static','final','String','int','new','return','if','else','try','catch','import','@Autowired','BigDecimal','HashMap','Thread','synchronized','volatile','Optional','Stream','List','Map','@Bean','@Service','@RestController','Kafka','Redis','JPA','SQL','API'];
    var bg=document.getElementById('bg');
    for(var i=0;i<30;i++){
      var sp=document.createElement('span');
      sp.textContent=codeWords[Math.floor(Math.random()*codeWords.length)];
      sp.style.left=Math.random()*100+'%';
      sp.style.animationDuration=(8+Math.random()*12)+'s';
      sp.style.animationDelay=(-Math.random()*20)+'s';
      sp.style.fontSize=(10+Math.random()*8)+'px';
      bg.appendChild(sp);
    }
  </script>
</body>
</html>
