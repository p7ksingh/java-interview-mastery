<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9ce34"/>
      <stop offset="40%" style="stop-color:#ee2a7b"/>
      <stop offset="100%" style="stop-color:#6228d7"/>
    </linearGradient>
  </defs>

  <!-- Instagram gradient background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- White card in center -->
  <rect x="250" y="80" width="700" height="470" rx="30" fill="#fff" opacity="0.95"/>

  <!-- Coffee logo -->
  <circle cx="600" cy="170" r="48" fill="#ee2a7b" opacity="0.12"/>
  <text x="600" y="188" font-family="Arial" font-size="44" text-anchor="middle">☕</text>

  <!-- Brand name -->
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="48" font-weight="900" text-anchor="middle" fill="#1a1a1a" letter-spacing="-1.5">javabypankaj</text>

  <!-- Tagline -->
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#ee2a7b" font-weight="700">Crack Any Java Interview</text>

  <!-- Description lines -->
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#555">From Core Java to System Design</text>
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#555">Code · Diagrams · Ready-to-speak answers</text>

  <!-- Pills -->
  <rect x="410" y="435" width="80" height="30" rx="15" fill="#ee2a7b" opacity="0.1"/>
  <text x="450" y="455" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" fill="#ee2a7b">FREE</text>

  <rect x="510" y="435" width="180" height="30" rx="15" fill="#6228d7" opacity="0.1"/>
  <text x="600" y="455" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" fill="#6228d7">No Login Required</text>

  <rect x="710" y="435" width="80" height="30" rx="15" fill="#f9ce34" opacity="0.15"/>
  <text x="750" y="455" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" fill="#c8a020">Open</text>

  <!-- Domain -->
  <text x="600" y="515" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">www.javabypankaj.live</text>

  <!-- Bottom -->
  <text x="600" y="600" font-family="Arial" font-size="15" text-anchor="middle" fill="rgba(255,255,255,0.7)">by Pankaj Singh</text>
</svg>
