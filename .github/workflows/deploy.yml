name: Deploy to AWS S3

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://javabypankaj \
            --exclude ".git/*" \
            --exclude "node_modules/*" \
            --exclude "*.backup" \
            --exclude "parse_md.py" \
            --exclude "group_topics.py" \
            --exclude "package*" \
            --exclude ".netlify/*" \
            --exclude "netlify.toml" \
            --exclude "netlify/*" \
            --exclude ".github/*" \
            --delete

          # Fix content types
          aws s3 cp s3://javabypankaj/index.html s3://javabypankaj/index.html --content-type "text/html" --metadata-directive REPLACE
          aws s3 cp s3://javabypankaj/maintenance.html s3://javabypankaj/maintenance.html --content-type "text/html" --metadata-directive REPLACE
          aws s3 cp s3://javabypankaj/css/style.css s3://javabypankaj/css/style.css --content-type "text/css" --metadata-directive REPLACE
          aws s3 cp s3://javabypankaj/js/app.js s3://javabypankaj/js/app.js --content-type "application/javascript" --metadata-directive REPLACE
          aws s3 cp s3://javabypankaj/sitemap.xml s3://javabypankaj/sitemap.xml --content-type "application/xml" --metadata-directive REPLACE

      - name: Done
        run: echo "Deployed to http://javabypankaj.s3-website-ap-southeast-2.amazonaws.com"
