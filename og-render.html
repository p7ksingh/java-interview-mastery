<!DOCTYPE html>
<html>
<head>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:630px;background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7);display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
.card{width:700px;padding:50px;background:rgba(255,255,255,0.95);border-radius:30px;text-align:center;}
.logo{font-size:50px;margin-bottom:15px;}
.brand{font-size:48px;font-weight:900;color:#1a1a1a;letter-spacing:-2px;margin-bottom:8px;}
.tagline{font-size:22px;font-weight:700;color:#ee2a7b;margin-bottom:25px;}
.divider{width:200px;height:2px;background:#eee;margin:0 auto 25px;}
.desc{font-size:18px;color:#555;line-height:1.6;margin-bottom:25px;}
.pills{display:flex;justify-content:center;gap:12px;margin-bottom:30px;}
.pill{padding:8px 20px;border-radius:20px;font-size:14px;font-weight:700;}
.pill-pink{background:rgba(238,42,123,0.1);color:#ee2a7b;}
.pill-purple{background:rgba(98,40,215,0.1);color:#6228d7;}
.pill-gold{background:rgba(249,206,52,0.15);color:#b8930e;}
.domain{font-size:20px;font-weight:800;color:#1a1a1a;}
.author{position:fixed;bottom:15px;left:0;right:0;text-align:center;font-size:16px;color:rgba(255,255,255,0.7);}
</style>
</head>
<body>
<div class="card">
  <div class="logo">☕</div>
  <div class="brand">javabypankaj</div>
  <div class="tagline">Crack Any Java Interview</div>
  <div class="divider"></div>
  <div class="desc">From Core Java to System Design<br>Code · Diagrams · Ready-to-speak answers</div>
  <div class="pills">
    <span class="pill pill-pink">FREE</span>
    <span class="pill pill-purple">No Login Required</span>
    <span class="pill pill-gold">Open Source</span>
  </div>
  <div class="domain">www.javabypankaj.live</div>
</div>
<div class="author">by Pankaj Singh</div>
</body>
</html>
