  <!-- Visitor Counter — counts unique visitors, visible to everyone -->
  <script>
  (function() {
    var KEY = 'jim.visitor.counted';
    var STORE_KEY = 'jim.visitor.total';
    var counterEl = document.getElementById('visitorCount');

    // Use a simple JSON bin (free) to store count persistently
    // Fallback: use localStorage-based estimation with a shared counter
    var API_URL = 'https://api.countapi.xyz';
    var NAMESPACE = 'java-interview-mastery';
    var COUNTER_KEY = 'visitors';

    function formatNumber(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return String(n);
    }

    function showCount(n) {
      if (counterEl) counterEl.textContent = formatNumber(n);
    }

    // Try CountAPI (free, no signup)
    var isNewVisitor = !localStorage.getItem(KEY);

    if (isNewVisitor) {
      // Hit the counter (increment)
      fetch(API_URL + '/hit/' + NAMESPACE + '/' + COUNTER_KEY)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          localStorage.setItem(KEY, '1');
          localStorage.setItem(STORE_KEY, String(data.value));
          showCount(data.value);
        })
        .catch(function() {
          // Fallback: just show cached count
          var cached = localStorage.getItem(STORE_KEY);
          showCount(cached ? parseInt(cached, 10) : 1);
        });
    } else {
      // Returning visitor — get current count without incrementing
      fetch(API_URL + '/get/' + NAMESPACE + '/' + COUNTER_KEY)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          localStorage.setItem(STORE_KEY, String(data.value));
          showCount(data.value);
        })
        .catch(function() {
          var cached = localStorage.getItem(STORE_KEY);
          showCount(cached ? parseInt(cached, 10) : '—');
        });
    }
  })();
  </script>
