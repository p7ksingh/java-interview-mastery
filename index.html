<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Interview Mastery</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%234A90D9'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='17' font-weight='700' text-anchor='middle' fill='white'%3EJ%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="topbar">
    <div class="topbar__left">
      <div class="topbar__logo">☕</div>
      <span class="topbar__brand">Java Interview Mastery</span>
    </div>
    <div class="topbar__right">
      <div class="topbar__search">
        <input type="search" id="searchInput" placeholder="Search questions..." autocomplete="off" spellcheck="false">
        <kbd>⌘K</kbd>
      </div>
      <div class="topbar__visitor" id="visitorCounter">👁 <span id="visitorCount">—</span></div>
    </div>
  </nav>

  <div class="page">
    <div class="page__header" id="pageHeader">
      <h1 id="pageTitle">Interview Topics</h1>
      <div class="page__actions" id="pageActions"></div>
    </div>
    <div class="page__body" id="pageBody">
      <div class="loader"><div class="loader__spin"></div></div>
    </div>
  </div>

  <div class="qnav" id="qnav" hidden>
    <button class="qnav__btn" id="prevBtn">← Prev</button>
    <span class="qnav__pos" id="qnavPos"></span>
    <button class="qnav__btn" id="nextBtn">Next →</button>
  </div>

  <script src="js/app.js"></script>
  <script>
  (function(){
    var el=document.getElementById('visitorCount');
    // Use hits.dwyl.com — free, no signup, always works
    var img = new Image();
    img.onload = function(){};
    img.src = 'https://hits.dwyl.com/p7ksingh/javabypankaj.svg';
    
    // Fetch the count from the badge API
    fetch('https://hits.dwyl.com/p7ksingh/javabypankaj.json')
      .then(function(r){ return r.json(); })
      .then(function(d){
        var count = d.count || d.message || 0;
        el.textContent = count;
      })
      .catch(function(){
        // Fallback: use localStorage counter
        var key = 'jim.local.visits';
        var n = parseInt(localStorage.getItem(key) || '0', 10);
        if (!sessionStorage.getItem('jim.counted')) {
          n++;
          localStorage.setItem(key, String(n));
          sessionStorage.setItem('jim.counted', '1');
        }
        el.textContent = n;
      });
  })();
  </script>
  <script data-goatcounter="https://java-interview-mastery.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
